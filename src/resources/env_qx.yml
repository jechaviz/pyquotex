qx:
  host: qxbroker.com
  urls:
    base: https://qxbroker.com/en/
    login: sign-in
    logged: trade
    logout: logout
  wss:
    url: wss://ws2.qxbroker.com/socket.io/?EIO=3&transport=websocket
    origin: https://qxbroker.com
    host: ws2.qxbroker.com
    enable_trace: false
    ping:
      interval: 25
      timeout: 15
      payload: 2
    retry:
      on: true 
      max_attempts: 5 
      wait: 5
    msg_interval:
      secs: 20
  proxies: None
  emails:
    no_reply: noreply@qxbroker.com
  locators:
    user_field: '#tab-1 input[name=email]'
    pass_field: '#tab-1 input[name=password]'
    submit_login: Sign In
    pin_sent: Please enter the PIN-code we've just sent to your email
    pin_field: input[name=code]
    submit_pin: button[type=submit]
  session:
    timeout_secs: 3600
browser:
  user_data_dir: browser/instance/quotex.default